name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: it-erben/ci/.github/workflows/lint.yml@1.0.0

  slides:
    uses: it-erben/ci/.github/workflows/slides.yml@1.0.0

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm --prefix material/cloud-logging install --no-audit --no-fund
      - run: npm run lint:js

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff black
      - run: ruff check labs/cloud-storage-emulator
      - run: black --check labs/cloud-storage-emulator

  lint-terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [labs/cloud-loadbalancer, terraform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  verify-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: material/cloud-logging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm test

  release:
    needs: [lint, slides, lint-js, lint-python, lint-terraform, verify-node]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: it-erben/ci/.github/workflows/release.yml@1.0.0

  pages:
    needs: [slides, release]
    if: needs.release.outputs.published == 'true'
    permissions:
      pages: write
      id-token: write
    uses: it-erben/ci/.github/workflows/pages.yml@1.0.0
