include:
    - component: 'gitlab.com/it-erben/components/pdf-publisher/build-publish@1.7.0'
    - component: 'gitlab.com/it-erben/components/linters/lychee-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/yaml-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/markdown-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/release/release@1.0.0'
    - component: 'gitlab.com/it-erben/components/training-deploy/deploy@1.4.0'

stages:
    - lint
    - build
    - verify
    - release
    - deploy

variables:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_CACHE_DIR: '1'

lint:js:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - npm --prefix material/api-gateway install --no-audit --no-fund
        - npm --prefix material/cloud-logging install --no-audit --no-fund
        - npm run lint:js

lint:python:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: python:3.14-slim
    script:
        - python -m pip install ruff black
        - ruff check labs/05-appengine labs/cloud-storage-emulator
        - black --check labs/05-appengine labs/cloud-storage-emulator

lint:terraform:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image:
        name: hashicorp/terraform:1.14
        entrypoint: ['']
    script:
        - cd labs/cloud-loadbalancer
        - terraform fmt -check -diff
        - terraform init -backend=false -input=false
        - terraform validate

verify:node_api_gateway:
    stage: verify
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - cd material/api-gateway
        - npm install --no-audit --no-fund
        - npm test

verify:node_cloud_logging:
    stage: verify
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - cd material/cloud-logging
        - npm install --no-audit --no-fund
        - npm test
