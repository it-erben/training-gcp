include:
    - component: 'gitlab.com/it-erben/components/linters/lychee-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/yaml-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/markdown-lint@1.3.0'

stages:
    - lint
    - verify

variables:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_CACHE_DIR: '1'

lint:js:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - npm --prefix api-gateway install --no-audit --no-fund
        - npm --prefix cloud-logging install --no-audit --no-fund
        - npm run lint:js

lint:python:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: python:3.14-slim
    script:
        - python -m pip install ruff black
        - ruff check appengine cloud-storage-emulator
        - black --check appengine cloud-storage-emulator

lint:terraform:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image:
        name: hashicorp/terraform:1.14
        entrypoint: ['']
    script:
        - cd cloud-loadbalancer
        - terraform fmt -check -diff
        - terraform init -backend=false -input=false
        - terraform validate

verify:node_api_gateway:
    stage: verify
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - cd api-gateway
        - npm install --no-audit --no-fund
        - npm test

verify:node_cloud_logging:
    stage: verify
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - cd cloud-logging
        - npm install --no-audit --no-fund
        - npm test
