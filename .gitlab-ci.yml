include:
  - component: "$CI_SERVER_FQDN/it-erben/components/linters/lychee-lint@1.2.0"
  - component: "$CI_SERVER_FQDN/it-erben/components/linters/yaml-lint@1.2.0"
  - component: "$CI_SERVER_FQDN/it-erben/components/linters/markdown-lint@1.2.0"

stages:
  - lint
  - verify

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

lint:js:
  stage: lint
  image: node:18
  script:
    - |
      set -euo pipefail
      for dir in api-gateway cloud-logging; do
        (
          cd "$dir"
          npm install --no-audit --no-fund
          npm run lint
          npm run format:check
        )
      done

lint:python:
  stage: lint
  image: python:3.11
  script:
    - python -m pip install ruff black
    - ruff check appengine cloud-storage-emulator
    - black --check appengine cloud-storage-emulator

lint:shellcheck:
  stage: lint
  image: koalaman/shellcheck:stable
  script:
    - shellcheck cloud-metrics/setup.sh cloud-loadbalancer/setup.sh

lint:shfmt:
  stage: lint
  image: mvdan/shfmt:v3.7.0
  script:
    - shfmt -i 2 -ci -d cloud-metrics/setup.sh cloud-loadbalancer/setup.sh

lint:terraform:
  stage: lint
  image: hashicorp/terraform:1.6.6
  script:
    - cd cloud-loadbalancer
    - terraform fmt -check -diff
    - terraform init -backend=false -input=false
    - terraform validate

verify:node_api_gateway:
  stage: verify
  image: node:18
  script:
    - cd api-gateway
    - npm install --no-audit --no-fund
    - npm test

verify:node_cloud_logging:
  stage: verify
  image: node:18
  script:
    - cd cloud-logging
    - npm install --no-audit --no-fund
    - npm test

