include:
    - component: 'gitlab.com/it-erben/components/pdf-publisher/build-publish@1.8.0'
    - component: 'gitlab.com/it-erben/components/linters/lychee-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/yaml-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/linters/markdown-lint@1.3.0'
    - component: 'gitlab.com/it-erben/components/release/release@1.1.0'
    - component: 'gitlab.com/it-erben/components/training-deploy/deploy@1.4.2'

stages:
    - lint
    - build
    - verify
    - release
    - deploy

variables:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_CACHE_DIR: '1'

lint:js:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - npm --prefix material/cloud-logging install --no-audit --no-fund
        - npm run lint:js

lint:python:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: python:3.14-slim
    script:
        - python -m pip install ruff black
        - ruff check labs/cloud-storage-emulator
        - black --check labs/cloud-storage-emulator

lint:terraform:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image:
        name: hashicorp/terraform:1.14
        entrypoint: ['']
    script:
        - cd labs/cloud-loadbalancer
        - terraform fmt -check -diff
        - terraform init -backend=false -input=false
        - terraform validate

lint:terraform:projects:
    stage: lint
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image:
        name: hashicorp/terraform:1.14
        entrypoint: ['']
    script:
        - cd terraform
        - terraform fmt -check -diff
        - terraform init -backend=false -input=false
        - terraform validate

.terraform:projects:
    image:
        name: hashicorp/terraform:1.14
        entrypoint: ['']
    before_script:
        - cd terraform
        - >-
            terraform init -reconfigure
            -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/projects"
            -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/projects/lock"
            -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/projects/lock"
            -backend-config="username=gitlab-ci-token"
            -backend-config="password=${CI_JOB_TOKEN}"
            -backend-config="lock_method=POST"
            -backend-config="unlock_method=DELETE"
            -backend-config="retry_wait_min=5"

plan:terraform:projects:
    extends: .terraform:projects
    stage: build
    rules:
        - if: $CI_MERGE_REQUEST_ID
    script:
        - terraform plan -input=false
    resource_group: terraform-projects

apply:terraform:projects:
    extends: .terraform:projects
    stage: deploy
    rules:
        - if: $CI_COMMIT_TAG
    script:
        - terraform apply -auto-approve -input=false
    resource_group: terraform-projects
    retry:
        max: 2
        when: script_failure

verify:node_cloud_logging:
    stage: verify
    rules:
        - if: $CI_MERGE_REQUEST_ID
    image: node:24-alpine
    script:
        - cd material/cloud-logging
        - npm install --no-audit --no-fund
        - npm test
